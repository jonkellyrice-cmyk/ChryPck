name: Temporary PASS 2 Native Orchestrator

on:
  push:
    branches: [main]
    paths:
      - "scripts/tmp_pass2_migrate.py"
      - "scripts/tmp_pass2_validate.py"
      - ".github/workflows/tmp-pass2-native-orchestrator.yml"

concurrency:
  group: chrypck-pass2-native-orchestrator
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run PASS 2 migration script
        run: python3 scripts/tmp_pass2_migrate.py
      - name: Run PASS 2 validation script
        run: python3 scripts/tmp_pass2_validate.py
      - name: Verify generated diff
        run: git diff --check
      - name: Remove temporary PASS 2 machinery
        run: |
          rm scripts/tmp_pass2_migrate.py
          rm scripts/tmp_pass2_validate.py
          rm .github/workflows/tmp-pass2-native-orchestrator.yml
      - name: Commit PASS 2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "PASS 2: native request orchestration"
          git push
