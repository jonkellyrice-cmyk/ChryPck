name: Run trace one-off

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-trace-one-off.yml'

permissions:
  contents: write

jobs:
  run-trace-one-off:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Execute one-off and publish result
        shell: bash
        run: |
          set +e
          npm ci >/tmp/trace-install.log 2>&1
          install_code=$?

          dry_code=99
          apply_code=99
          if [ "$install_code" -eq 0 ]; then
            node one_off/add-causal-trace-macro.mjs --dry-run >/tmp/trace-dry.log 2>&1
            dry_code=$?
            if [ "$dry_code" -eq 0 ]; then
              node one_off/add-causal-trace-macro.mjs >/tmp/trace-apply.log 2>&1
              apply_code=$?
            fi
          fi

          printf 'install_exit=%s\ndry_run_exit=%s\napply_exit=%s\n' "$install_code" "$dry_code" "$apply_code" > .trace-one-off-result.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$install_code" -eq 0 ] && [ "$dry_code" -eq 0 ] && [ "$apply_code" -eq 0 ]; then
            rm -f .trace-one-off-result.txt
            rm -rf one_off/trace_payload
            rm -f one_off/add-causal-trace-macro.mjs
            rm -f .github/workflows/run-trace-one-off.yml
            git add -A
            git commit -m "Add causal trace workflow"
            git push origin HEAD:main
            exit $?
          fi

          {
            echo
            echo '--- install tail ---'
            tail -n 30 /tmp/trace-install.log 2>/dev/null || true
            echo
            echo '--- dry-run tail ---'
            tail -n 30 /tmp/trace-dry.log 2>/dev/null || true
            echo
            echo '--- apply tail ---'
            tail -n 50 /tmp/trace-apply.log 2>/dev/null || true
          } >> .trace-one-off-result.txt

          git add .trace-one-off-result.txt
          git commit -m "Record trace one-off failure"
          git push origin HEAD:main
          exit 1
