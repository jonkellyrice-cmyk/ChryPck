name: Run trace one-off

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-trace-one-off.yml'

permissions:
  contents: write

jobs:
  run-trace-one-off:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run trace generator
        run: node one_off/add-causal-trace-macro.mjs --dry-run

      - name: Apply trace generator and validate
        run: node one_off/add-causal-trace-macro.mjs

      - name: Remove temporary generator artifacts
        run: |
          rm -rf one_off/trace_payload
          rm -f one_off/add-causal-trace-macro.mjs
          rm -f .github/workflows/run-trace-one-off.yml

      - name: Commit generated trace implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Add causal trace workflow"
          git push origin HEAD:main
