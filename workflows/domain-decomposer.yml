name: Domain Decomposer

on:
  push:
    paths:
      - "dev_scripts/domain-decomposer-plan.json"
      - "dev_scripts/domain-decomposer-execution-request.txt"

permissions:
  contents: write

jobs:
  apply-approved-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read plan approval
        id: plan
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const plan = JSON.parse(fs.readFileSync('dev_scripts/domain-decomposer-plan.json', 'utf8'));
          const candidates = Array.isArray(plan.candidates) ? plan.candidates : [];
          const approved = plan.approved === true && candidates.length > 0 && candidates.every(candidate => candidate.execution?.approved === true);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `approved=${approved ? 'true' : 'false'}\n`);
          NODE

      - name: Executor self-test
        if: steps.plan.outputs.approved == 'true'
        run: npm run decompose:apply:self-test

      - name: Dry-run approved decomposition
        if: steps.plan.outputs.approved == 'true'
        run: npm run decompose:apply -- --dry-run

      - name: Apply approved decomposition
        if: steps.plan.outputs.approved == 'true'
        run: npm run decompose:apply -- --apply

      - name: Remove generated patch artifact
        if: steps.plan.outputs.approved == 'true'
        run: rm -f dev_scripts/domain-decomposer-generated-patch.json

      - name: Repository audit
        if: steps.plan.outputs.approved == 'true'
        run: npm run audit

      - name: Symbol family audit
        if: steps.plan.outputs.approved == 'true'
        run: npm run symbol-family-audit

      - name: Effect atlas
        if: steps.plan.outputs.approved == 'true'
        run: npm run effect-atlas

      - name: Restore tracked audit reports
        if: steps.plan.outputs.approved == 'true'
        shell: bash
        run: |
          git restore --worktree -- repo-audit-report.json 2>/dev/null || true
          git restore --worktree -- symbol-family-audit-report.json 2>/dev/null || rm -f symbol-family-audit-report.json
          git restore --worktree -- effect-atlas-report.json 2>/dev/null || rm -f effect-atlas-report.json

      - name: Verify structural-only scope
        if: steps.plan.outputs.approved == 'true'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const plan = JSON.parse(fs.readFileSync('dev_scripts/domain-decomposer-plan.json', 'utf8'));
          const allowed = new Set();
          for (const candidate of plan.candidates ?? []) {
            if (candidate.source) allowed.add(candidate.source);
            if (candidate.retained_spine?.file) allowed.add(candidate.retained_spine.file);
            for (const unit of candidate.units ?? []) {
              if (unit.target) allowed.add(unit.target);
            }
          }
          const raw = cp.execSync('git status --porcelain --untracked-files=all', { encoding: 'utf8' });
          const status = raw.split(/\r?\n/).filter(line => line.length > 0);
          const unexpected = status
            .map(line => line.slice(3))
            .filter(path => !allowed.has(path));
          if (unexpected.length) {
            console.error('Unexpected changed paths:');
            console.error(unexpected.join('\n'));
            process.exit(1);
          }
          NODE

      - name: Commit approved decomposition
        if: steps.plan.outputs.approved == 'true'
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No decomposition changes to commit."
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const plan = JSON.parse(fs.readFileSync('dev_scripts/domain-decomposer-plan.json', 'utf8'));
          const allowed = new Set();
          for (const candidate of plan.candidates ?? []) {
            if (candidate.source) allowed.add(candidate.source);
            if (candidate.retained_spine?.file) allowed.add(candidate.retained_spine.file);
            for (const unit of candidate.units ?? []) {
              if (unit.target) allowed.add(unit.target);
            }
          }
          for (const path of allowed) {
            if (fs.existsSync(path) || cp.spawnSync('git', ['ls-files', '--error-unmatch', path], { stdio: 'ignore' }).status === 0) {
              cp.execFileSync('git', ['add', '--', path]);
            }
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "domain-decomposer: apply approved decomposition"
          git push
